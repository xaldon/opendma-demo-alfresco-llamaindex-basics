[project]
name = "opendma-demo-alfresco-llamaindex-basics"
version = "0.1.0"
description = "Sample LlamaIndex applications for Alfresco content exposed through OpenDMA"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "llama-index>=0.14.0",
    "llama-index-readers-opendma>=0.3.0.dev1",
    "llama-index-retrievers-opendma>=0.3.0.dev1",
    "llama-index-tools-opendma>=0.3.0.dev1",
    "llama-index-readers-file>=0.5.0",
    "llama-index-readers-docling>=0.5.0",
    "llama-index-llms-openai>=0.6.0",
    "llama-index-embeddings-openai>=0.5.0",
    "opendma-api>=0.8.0",
    "opendma-remote>=0.8.0",
]

[project.scripts]
alfresco-index-chat = "opendma_demo_alfresco_llamaindex_basics.reader_index_chat:main"
alfresco-live-search = "opendma_demo_alfresco_llamaindex_basics.live_retriever_search:main"
alfresco-tool-agent = "opendma_demo_alfresco_llamaindex_basics.tool_agent:main"

[tool.uv.sources]
llama-index-readers-opendma = { path = "../llama-index-opendma/packages/llama-index-readers-opendma", editable = true }
llama-index-retrievers-opendma = { path = "../llama-index-opendma/packages/llama-index-retrievers-opendma", editable = true }
llama-index-tools-opendma = { path = "../llama-index-opendma/packages/llama-index-tools-opendma", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendma_demo_alfresco_llamaindex_basics"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
